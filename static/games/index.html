<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>游戏大厅</title><link rel="stylesheet" href="app.css?v=32"></head>
<body><main class="game-shell"><header class="game-top"><h1 id="title"></h1><div class="game-actions"><div class="score-box"><small>得分</small><strong id="score">0</strong></div><button id="pause" class="quiet-button">暂停</button><button id="restart" class="quiet-button">重开</button><button id="show-help" class="help-button" aria-label="查看玩法与计分规则" title="玩法与计分规则">?</button></div></header><div class="game-toolbar"><span id="status" role="status">准备就绪</span><span id="category"></span></div><section id="stage" aria-label="游戏区域"></section><nav id="touch-controls" aria-label="游戏操作"></nav></main>
<dialog id="help"><header><h2>玩法</h2><button id="close-help" aria-label="关闭玩法说明">×</button></header><p id="instructions"></p><h3>计分</h3><p id="rule"></p><p class="local-note">结束后可填写昵称，提交到本机排行榜。</p></dialog>
<div id="pause-cover" hidden><div><span>Ⅱ</span><h2>休息一下。</h2><p id="pause-message">游戏已暂停。</p><button id="resume">继续游戏</button></div></div>
<dialog id="result"><form id="submit-score"><p class="result-label">本局结束</p><h2 id="result-title">游戏结束</h2><p id="result-detail"></p><div class="result-score"><small>最终得分</small><strong id="final-score"></strong></div><label for="nickname">你的昵称</label><input id="nickname" name="nickname" maxlength="20" required placeholder="请输入昵称" autocomplete="nickname"><p class="local-note">可选择提交 · 仅保存在当前浏览器</p><p id="submit-message" role="status"></p><button class="primary" type="submit" id="save-score">提交成绩</button><div class="result-actions"><button type="button" id="skip">暂不提交</button><button type="button" id="again">再玩一局</button></div></form></dialog>
<script src="leaderboard-config.js?v=32"></script><script src="catalog.js?v=32"></script><script src="leaderboard.js?v=32"></script><script src="world.js?v=32"></script><script src="modes3d.js?v=32"></script><script src="city-architecture.js?v=32"></script><script src="city-terrain.js?v=32"></script><script src="city-interiors.js?v=32"></script><script src="city-tours.js?v=32"></script><script src="city-world.js?v=32"></script><script src="city-materials.js?v=32"></script><script src="city-civic.js?v=32"></script><script src="city-skyscraper.js?v=32"></script><script src="city-landmarks.js?v=32"></script><script src="city-streets.js?v=32"></script><script src="city-detail-assets.js?v=32"></script><script src="city-interior-scene.js?v=32"></script><script src="city-terrain-mesh.js?v=32"></script><script src="city-preload.js?v=32"></script><script src="city-landscape.js?v=32"></script><script src="city-life.js?v=32"></script><script src="city-motion.js?v=32"></script><script src="city-map.js?v=32"></script><script src="city3d.js?v=32"></script><script src="app.js?v=32"></script></body></html>
